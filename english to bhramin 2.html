<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tamizhi (தமிழி / Tamil-Brahmi) Script Translator</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Brahmi&family=Noto+Sans+Tamil&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Inline CSS moved to style.css
  <style>
    :root {
      --ink: #1f1a17;
      --clay: #8b4f32;
      --clay-dark: #563226;
      --sand: #d8c49a;
      --parchment: #f4eddb;
      --stone: #393733;
      --gold: #c7a86a;
      --saffron: #e58b32;
      --turquoise: #168b8b;
      --rose: #c95d76;
    }

    * { box-sizing: border-box; }

    html { overflow-x: hidden; }

    body {
      min-height: 100vh;
      max-width: none;
      margin: 0;
      padding: 42px 16px 70px;
      color: var(--ink);
      font-family: Georgia, "Noto Serif Tamil", "Noto Sans Tamil", system-ui, sans-serif;
      background:
        repeating-linear-gradient(0deg, rgba(86,50,38,.025) 0, rgba(86,50,38,.025) 1px, transparent 1px, transparent 5px),
        radial-gradient(circle at 12% 18%, rgba(229,139,50,.34), transparent 20rem),
        radial-gradient(circle at 88% 78%, rgba(22,139,139,.26), transparent 22rem),
        linear-gradient(135deg, #fff2ca, #f7f0dc 52%, #d8efe6);
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 12px;
      border: 1px solid rgba(86,50,38,.22);
      pointer-events: none;
      z-index: 3;
    }

    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      inset: 0;
      background: url("images (4).jpg") center / cover no-repeat;
      opacity: .75;
      pointer-events: none;
    }

    .floating-script {
      position: fixed;
      z-index: 0;
      color: rgba(86,50,38,.2);
      font-family: "Noto Sans Brahmi", serif;
      pointer-events: none;
      user-select: none;
      animation: glyph-drift 9s ease-in-out infinite;
    }

    .floating-script-one {
      top: 16%;
      left: 7%;
      font-size: 4.5rem;
    }

    .floating-script-two {
      top: 49%;
      right: 7%;
      font-size: 5.5rem;
      animation-delay: -3s;
    }

    .floating-script-three {
      bottom: 10%;
      left: 14%;
      font-size: 3.5rem;
      animation-delay: -6s;
    }

    @keyframes glyph-drift {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-16px) rotate(5deg); }
    }

    .museum-shell {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: auto;
    }

    .title-panel {
      position: relative;
      text-align: center;
      padding: 28px 22px 24px;
      border: 1px solid rgba(86,50,38,.24);
      border-radius: 18px 18px 6px 6px;
      background: rgba(255,251,238,.78);
      box-shadow: 0 18px 45px rgba(86,50,38,.12), inset 0 1px rgba(255,255,255,.8);
      backdrop-filter: blur(8px);
      overflow: hidden;
      border: 1px solid rgba(197,132,49,.38);
      background: linear-gradient(135deg, rgba(255,251,238,.94), rgba(227,247,239,.88));
    }

    .title-panel::before,
    .title-panel::after {
      content: "𑀁";
      position: absolute;
      top: 20px;
      color: var(--clay);
      font-family: "Noto Sans Brahmi", serif;
      font-size: 1.8rem;
    }

    .title-panel::before { left: 24px; }
    .title-panel::after { right: 24px; }

    h2 {
      margin: 0;
      color: var(--clay-dark);
      font-size: clamp(1.55rem, 4vw, 2.25rem);
      background: linear-gradient(90deg, #a84f28, #168b8b, #c95d76);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: title-colour 7s linear infinite;
    }

    @keyframes title-colour { to { background-position: 200% center; } }

    .subtitle {
      margin: 8px 0 0;
      color: #786852;
      font-family: system-ui, sans-serif;
      font-size: .78rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .translator-panel {
      margin-top: 18px;
      padding: 18px;
      border: 1px solid rgba(86,50,38,.18);
      border-radius: 14px;
      background: rgba(255,255,255,.42);
      box-shadow: 0 18px 42px rgba(80,75,56,.16), inset 0 1px rgba(255,255,255,.9);
      backdrop-filter: blur(10px);
      animation: panel-in .65s ease-out both;
    }

    @keyframes panel-in {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    label {
      display: block;
      margin: 0 0 8px 2px;
      color: var(--clay-dark);
      font-family: system-ui, sans-serif;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px 18px;
      border: 2px solid transparent;
      background:
        linear-gradient(var(--parchment), var(--parchment)) padding-box,
        linear-gradient(90deg, var(--saffron), var(--turquoise), var(--rose)) border-box;
      outline: none;
      background: var(--parchment);
      color: var(--ink);
      font-family: "Noto Sans Tamil", Georgia, system-ui, sans-serif;
      font-size: 1.35rem;
      box-shadow: inset 0 2px 8px rgba(86,50,38,.07);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    input:focus {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(22,139,139,.16), 0 0 0 4px rgba(229,139,50,.16);
    }

    .tamil-preview {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(229,139,50,.22);
      border-left: 5px solid var(--saffron);
      border-radius: 9px;
      background: linear-gradient(90deg, rgba(255,244,208,.92), rgba(214,243,235,.88));
      color: #514738;
      font-size: 1.15rem;
      font-family: "Noto Sans Tamil", Georgia, serif;
      box-shadow: 0 8px 18px rgba(80,75,56,.08);
    }

    .stone-tablet {
      position: relative;
      min-height: 160px;
      margin-top: 16px;
      padding: 42px 32px 34px;
      border: 1px solid #625e55;
      border-radius: 12px 12px 28px 28px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.11), transparent 35%),
        repeating-linear-gradient(92deg, transparent 0, transparent 18px, rgba(255,255,255,.035) 19px),
        radial-gradient(ellipse at 50% 0, rgba(193,177,143,.16), transparent 62%),
        var(--stone);
      color: #ead9b4;
      font-family: "Noto Sans Brahmi", "Noto Sans Tamil", serif;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      line-height: 1.7;
      letter-spacing: .08em;
      word-wrap: break-word;
      text-align: center;
      text-shadow: 1px 2px 0 #1d1b19, -1px -1px 0 #676258;
      box-shadow:
        inset 0 0 28px rgba(0,0,0,.42),
        inset 0 2px 0 rgba(255,255,255,.08),
        0 24px 38px rgba(56,43,31,.25),
        0 6px 0 #292824;
      animation: tablet-drift 7s ease-in-out infinite;
      transform-origin: center bottom;
    }

    @keyframes tablet-drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .stone-tablet::before {
      content: "𑁇  TAMIL-BRAHMI INSCRIPTION  𑁇";
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      color: #a99e82;
      font-family: Georgia, serif;
      font-size: .66rem;
      letter-spacing: .16em;
      text-shadow: none;
    }

    .stone-tablet::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(234,217,180,.08);
      border-radius: 7px 7px 22px 22px;
      pointer-events: none;
    }

    @media (max-width: 620px) {
      body {
        min-height: 100dvh;
        padding:
          max(16px, env(safe-area-inset-top))
          max(10px, env(safe-area-inset-right))
          max(30px, env(safe-area-inset-bottom))
          max(10px, env(safe-area-inset-left));
      }

      body::before { inset: 5px; }

      .floating-script-two { display: none; }

      .floating-script-one {
        top: 10%;
        left: 2%;
        font-size: 2.8rem;
      }

      .floating-script-three {
        bottom: 5%;
        left: auto;
        right: 3%;
        font-size: 2.5rem;
      }

      .museum-shell { width: 100%; }

      .title-panel {
        padding: 20px 12px 18px;
        border-radius: 14px 14px 5px 5px;
      }

      .title-panel::before,
      .title-panel::after { display: none; }

      h2 { font-size: clamp(1.35rem, 7vw, 1.75rem); }

      .subtitle {
        font-size: .68rem;
        line-height: 1.5;
        letter-spacing: .1em;
      }

      .translator-panel {
        margin-top: 12px;
        padding: 10px;
        border-radius: 10px;
      }

      label {
        line-height: 1.4;
        font-size: .72rem;
      }

      input {
        min-height: 52px;
        padding: 13px 14px;
        font-size: 16px;
      }

      .tamil-preview {
        padding: 10px 12px;
        font-size: 1rem;
        overflow-wrap: anywhere;
      }

      .stone-tablet {
        min-height: 145px;
        margin-top: 12px;
        padding: 44px 12px 24px;
        border-radius: 9px 9px 20px 20px;
        font-size: clamp(1.45rem, 8vw, 2.15rem);
        line-height: 1.55;
        letter-spacing: .04em;
        overflow-wrap: anywhere;
      }

      .stone-tablet::before {
        top: 11px;
        font-size: .54rem;
        letter-spacing: .08em;
        white-space: nowrap;
      }
    }

    @media (max-width: 380px) {
      h2 { font-size: 1.25rem; }
      .subtitle { letter-spacing: .06em; }
      .stone-tablet {
        padding-inline: 8px;
        font-size: 1.35rem;
      }
      .stone-tablet::before {
        max-width: 95%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    .example-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      margin-bottom: -8px;
    }

    .example-chip {
      flex: 1 1 120px;
      padding: 10px 14px;
      border: 2px solid transparent;
      border-radius: 12px;
      background:
        linear-gradient(var(--parchment), var(--parchment)) padding-box,
        linear-gradient(90deg, var(--saffron), var(--turquoise), var(--rose)) border-box;
      color: var(--ink);
      font-family: "Noto Sans Tamil", Georgia, system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background-color .2s ease;
    }

    .example-chip:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(22,139,139,.12), 0 0 0 4px rgba(229,139,50,.12);
    }

    .example-chip:active {
      transform: translateY(1px);
      box-shadow: 0 4px 8px rgba(22,139,139,.12), 0 0 0 2px rgba(229,139,50,.12);
    }

    .copy-button {
      margin-left: 8px;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: var(--clay);
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      transition:
        transform .2s ease,
        background-color .2s ease;
    }

    .copy-button:hover {
      transform: translateY(-2px);
      background: var(--clay-dark);
    }

    .copy-button:active {
      transform: translateY(1px);
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .action-button {
      flex: 1 1 120px;
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      background:
        linear-gradient(var(--parchment), var(--parchment)) padding-box,
        linear-gradient(90deg, var(--saffron), var(--turquoise), var(--rose)) border-box;
      color: var(--ink);
      font-family: "Noto Sans Tamil", Georgia, system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background-color .2s ease;
    }

    .action-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(22,139,139,.12), 0 0 0 4px rgba(229,139,50,.12);
    }

    .action-button:active {
      transform: translateY(1px);
      box-shadow: 0 4px 8px rgba(22,139,139,.12), 0 0 0 2px rgba(229,139,50,.12);
    }

    .action-button.secondary {
      background: rgba(255,255,255,.6);
      color: var(--ink);
    }

    .action-button.secondary:hover {
      background: rgba(255,255,255,.8);
    }
  </style>
  -->
</head>
<body>
  <span class="floating-script floating-script-three" aria-hidden="true">𑀢𑀮</span>
  <main class="museum-shell">
    <header class="title-panel">
      <h2>தமிழி Epigraphic Translator</h2>
      <p class="subtitle">Tamil & Tanglish → Ancient Tamil-Brahmi</p>
    </header>

    <section class="translator-panel">
      <label for="modernInput">Enter Tamil or Tanglish inscription text</label>
      <input type="text" id="modernInput" value="thamizh" oninput="transliterateToBrahmi()" placeholder="தமிழ் or thamizh / vanakkam / name" />

      <div class="example-row" aria-label="Example words">
        <button type="button" class="example-chip" onclick="setExample('வணக்கம்')">வணக்கம்</button>
        <button type="button" class="example-chip" onclick="setExample('தமிழ்')">தமிழ்</button>
        <button type="button" class="example-chip" onclick="setExample('நன்றி')">நன்றி</button>
        <button type="button" class="example-chip" onclick="setExample('செயற்கை நுண்ணறிவு')">செயற்கை நுண்ணறிவு</button>
      </div>

      <div class="tamil-preview">
        <strong>Modern Tamil:</strong> <span id="tamilOutput">தமிழ்</span>
      </div>

      <div class="stone-tablet" id="brahmiOutput">𑀢𑀫𑀺𑀵𑁆</div>

      <div class="action-row">
        <button type="button" class="action-button" onclick="copyBrahmi()">Copy Brahmi</button>
        <button type="button" class="action-button secondary" onclick="clearTranslator()">Clear</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
